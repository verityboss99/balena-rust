[workspace]
resolver = "2"
members = [
    "crates/etcher-core",
    "crates/etcher-util",
    "crates/etcher-gui",
]

[workspace.package]
version = "2.1.9"
edition = "2024"
license = "Apache-2.0"
authors = ["Balena Ltd. <hello@balena.io>"]
description = "Flash OS images to SD cards and USB drives, safely and easily."

[workspace.dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "svg", "tokio", "wayland", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
rfd = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
flate2 = "1"
bzip2 = { version = "0.5", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
open = "5"
libc = "0.2"
tempfile = "3"
png = "0.17"
url = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
